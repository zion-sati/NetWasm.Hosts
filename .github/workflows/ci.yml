name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a change in a host or a pinned image shows before the next release.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Publish step, 100% line and branch coverage
        run: dotnet test NetWasm.Hosts.slnx -c Release
      - name: Host modules, 100% line, branch and function coverage
        run: eng/test-javascript.sh

  hosts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [verify-service-hosts, verify-native-hosts, verify-spinkube, verify-container, verify-aws-lambda,
                verify-azure-functions, verify-cloud-run-functions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: ${{ matrix.check }}
        run: eng/${{ matrix.check }}.sh
